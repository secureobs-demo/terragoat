name: SecureObs IaC Analysis

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secureobs-iac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secureobs-iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: "SecureObs static + Checkov — terraform/alicloud"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -e SECUREOBS_API_KEY="${{ secrets.SECUREOBS_API_KEY }}" \
            "secureobs/scanner:v1.4.2" scan \
              --project-id "8045cf75-d0f4-4d95-ab15-35cf7c3e30f4" \
              --tenant-id "eaca2727-6ddb-4f19-b602-53ae0c4ed0dd" \
              --pipeline-run-id "${{ github.run_id }}-566917f7eb1344989c5991204ad9e2ac" \
              --terraform-root-id "566917f7-eb13-4498-9c59-91204ad9e2ac" \
              --source-revision "${{ github.sha }}" \
              --iac-only \
              --require-infrastructure-analysis \
              --terraform-root "terraform/alicloud"

